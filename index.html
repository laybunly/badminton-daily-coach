<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6A52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Coach">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Badminton Daily Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen trainer. Court + aligned side-view height strip fill the free space; the compact decision panel sits below (phone) or beside (wide) and scrolls on its own, so the court never leaves the screen. */
:root{
  --bg:#E8EEEB; --surface:#FFFFFF; --ink:#15211C; --muted:#56665F; --line:#C9D5D0;
  --mat:#2E6A52; --mat-edge:#1F4D3A; --court-line:#F3F8F5; --side:#D9E4DF; --side-ink:#4A5D55;
  --you:#F2B134; --opp:#E4585D;
  --best:#178C61; --good:#2F6FC6; --inacc:#B07A0E; --mistake:#C93A42;
  --accent:#2E6A52; --on-accent:#FFFFFF;
  --m-best:#8FF5C3; --m-good:#A6CCFF; --m-inacc:#FFD166; --m-mistake:#FF8E93; --m-neutral:rgba(243,248,245,.75);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#16201C; --ink:#E5EDE9; --muted:#98A9A1; --line:#2A3832;
  --mat:#25573F; --mat-edge:#173A2A; --court-line:#E9F1ED; --side:#1B2722; --side-ink:#9DB1A8;
  --you:#F5BC4A; --opp:#EE6A6F;
  --best:#3CC08C; --good:#6AA4F0; --inacc:#E6AC3A; --mistake:#EE6B74;
  --accent:#62C495; --on-accent:#0D1412; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#16201C; --ink:#E5EDE9; --muted:#98A9A1; --line:#2A3832;
  --mat:#25573F; --mat-edge:#173A2A; --court-line:#E9F1ED; --side:#1B2722; --side-ink:#9DB1A8;
  --you:#F5BC4A; --opp:#EE6A6F;
  --best:#3CC08C; --good:#6AA4F0; --inacc:#E6AC3A; --mistake:#EE6B74;
  --accent:#62C495; --on-accent:#0D1412; color-scheme:dark}
html{height:100%;box-sizing:border-box;background:var(--bg)}
body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
*,*::before,*::after{box-sizing:border-box}
.app{height:100%;max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:8px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.brand{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;font:700 20px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font:600 11px/1.1 var(--f-body);letter-spacing:.16em;color:var(--muted)}
.stats{display:flex;gap:6px;align-items:stretch}
.lang{font:700 13px var(--f-body);letter-spacing:.04em;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:0 9px;cursor:pointer}
.lang:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px}
.stat b{font:700 18px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat small{font-size:9px;line-height:1.2;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.delta-up{color:var(--best)} .delta-down{color:var(--mistake)}
.dots{display:flex;gap:5px;overflow-x:auto;flex:none;padding:2px}
.dot{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--muted);font:600 14px var(--f-display);cursor:pointer;padding:0}
.dot.cur{border-color:var(--ink);color:var(--ink)}
.dot.r-best{background:var(--best);border-color:var(--best);color:#fff}
.dot.r-good{background:var(--good);border-color:var(--good);color:#fff}
.dot.r-inacc{background:var(--inacc);border-color:var(--inacc);color:#fff}
.dot.r-mistake{background:var(--mistake);border-color:var(--mistake);color:#fff}
.dot.cur.r-best,.dot.cur.r-good,.dot.cur.r-inacc,.dot.cur.r-mistake{outline:2px solid var(--ink);outline-offset:1px}
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.board{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:4px}
.legend{flex:none;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.legend .keys{display:flex;gap:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.replay{font:600 13px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;flex:none}
#svg{flex:1 1 0;min-height:0;width:100%;height:100%;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{flex:none;max-height:42%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
@media (min-width:760px){
  .main{flex-direction:row}
  .panel{width:380px;max-height:100%;padding:16px;gap:12px}
}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
h2{font:700 22px/1.05 var(--f-display);margin:0;text-wrap:balance}
.meta{font-size:12px;color:var(--muted);white-space:nowrap}
.q{margin:0;font-size:15px}
.q .step{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:500 14px/1.25 var(--f-body);color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:9px;padding:7px 8px;cursor:pointer;min-width:0}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--mat);color:#fff;font:700 14px var(--f-display)}
.opt .lbl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.g{align-self:flex-start;font:600 10px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 5px;border-radius:4px;color:#fff}
.opt.sel{border-color:var(--ink)}
.opt.view{background:var(--surface);border-color:var(--line)}
.g-best{background:var(--best)} .g-good{background:var(--good)} .g-inacc{background:var(--inacc)} .g-mistake{background:var(--mistake)}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--f-body);color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:999px;padding:5px 12px;cursor:pointer}
.chip.on{border-color:var(--ink);background:var(--surface)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--you)}
.per{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:0}
.verdict{border-radius:9px;padding:8px 10px;background:var(--bg);display:flex;flex-direction:column;gap:5px;font-size:14px}
.verdict .badge{align-self:flex-start;font:700 15px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:#fff;padding:5px 8px;border-radius:5px}
.verdict p{margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stick{position:sticky;bottom:-10px;background:var(--surface);padding-block:6px 2px;margin-top:-2px}
.btn{font:600 15px var(--f-body);border-radius:9px;padding:9px 16px;cursor:pointer;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.opt:focus-visible,.dot:focus-visible,.chip:focus-visible,.replay:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.lesson{border-left:4px solid var(--accent);padding:2px 0 2px 10px;font-size:15px;font-weight:500}
.score{font:700 36px/1 var(--f-display);font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--muted);margin:0}
#three{flex:1 1 0;min-height:0;position:relative;touch-action:none;border-radius:12px;overflow:hidden}
#three canvas{display:block;width:100%;height:100%}
.hint3{position:absolute;left:8px;bottom:8px;font-size:11px;color:#fff;background:rgba(0,0,0,.5);padding:3px 9px;border-radius:999px;pointer-events:none}
.load3{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.ctrls{display:flex;gap:6px;align-items:center;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{font:600 13px var(--f-body);padding:4px 11px;border:0;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:3px solid var(--good);outline-offset:-3px}
/* home */
.home{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:16px}
.hero{background:var(--mat);color:#F3F8F5;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero .eyebrow{font:600 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.hero h1{font:700 32px/1 var(--f-display);margin:0;text-wrap:balance}
.hero p{margin:0;opacity:.92}
.sqs{display:flex;gap:8px}
.sq{width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35)}
.hero .sq.r-best{background:var(--m-best);border-color:var(--m-best)} .hero .sq.r-good{background:var(--m-good);border-color:var(--m-good)}
.hero .sq.r-inacc{background:var(--m-inacc);border-color:var(--m-inacc)} .hero .sq.r-mistake{background:var(--m-mistake);border-color:var(--m-mistake)}
.btn.light{background:#F3F8F5;color:#173A2A;border-color:#F3F8F5;font-size:17px;padding:12px 24px;align-self:flex-start}
.bigscore{font:700 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.cd{font-size:13px;opacity:.85}
.sharebox{width:100%;min-height:96px;font:14px/1.4 var(--f-body);border-radius:8px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.25);color:#F3F8F5;padding:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font:700 22px/1.1 var(--f-display)}
.lrow{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.lrow b{display:block;font-size:15px}
.lrow .sq{width:16px;height:16px;border-radius:4px;flex:none;margin-top:3px;border:0}
.card .sq.r-best{background:var(--best)} .card .sq.r-good{background:var(--good)} .card .sq.r-inacc{background:var(--inacc)} .card .sq.r-mistake{background:var(--mistake)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);border:0;border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink);font:600 15px var(--f-body)}
.prow .pt{flex:1;min-width:0} .prow small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.prow:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.g-new{background:var(--muted)}
.playbar{display:flex;align-items:center;gap:8px;flex:none;min-width:0}
.playbar .dots{flex:1;min-width:0}
.backbtn{flex:none;font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.backbtn:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.pmode{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dot[disabled]{cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;max-width:90vw;text-align:center}
.plabel{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.levels{display:grid;gap:6px}
.lvl{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--bg);border:2px solid transparent;border-radius:10px;padding:10px 12px;color:var(--ink);cursor:pointer;font:600 15px var(--f-body)}
.lvl span{font-size:13px;font-weight:400;color:var(--muted)}
.lvl.on{border-color:var(--ink);background:var(--surface)}
.lvl:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.chip[disabled]{opacity:.5;cursor:default}
.prefline{font-size:14px}
.linkbtn{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}
.alley{fill:#000;opacity:.22}
.eb{font:600 11px/1.35 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.panel .badge{align-self:flex-start;font:700 15px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:#fff;padding:5px 8px;border-radius:5px}
.ochips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ochip{width:34px;height:34px;border-radius:50%;border:2px solid transparent;font:700 15px var(--f-display);color:#16201C;cursor:pointer;padding:0}
.ochip.on{border-color:var(--ink)}
.ochip:focus-visible{outline:3px solid var(--good);outline-offset:2px}
/* svg */
.mat{fill:var(--mat)} .cl{stroke:var(--court-line);stroke-width:5;fill:none}
.net{stroke:var(--court-line);stroke-width:9}
.myhalf{fill:var(--court-line);opacity:0} .myhalf.on{opacity:.07}
.tok circle{stroke:var(--mat-edge);stroke-width:4}
.tok.y circle{fill:var(--you)} .tok.o circle{fill:var(--opp)}
.tok text{font:700 30px var(--f-display);fill:#1A1A1A} .tok.o text{fill:#FFFFFF}
.tok.faded{opacity:.35} .tok.faded circle{stroke-dasharray:7 6}
.tok.ghost circle{fill:none;stroke:var(--court-line);stroke-width:4;stroke-dasharray:8 6} .tok.ghost text{fill:var(--court-line)}
.zone-good{fill:none;stroke:var(--court-line);stroke-width:3;stroke-dasharray:10 8;opacity:.8}
.zone-best{fill:var(--court-line);fill-opacity:.2;stroke:var(--court-line);stroke-width:3}
.ring{fill:none;stroke:var(--you);stroke-width:5}
.trail{fill:none;stroke:var(--court-line);stroke-width:3;stroke-dasharray:3 10;stroke-linecap:round;opacity:.7}
.side-bg{fill:var(--side)} .side-grid{stroke:var(--side-ink);stroke-width:1.5;opacity:.35;stroke-dasharray:4 8}
.side-txt{font:600 28px var(--f-display);fill:var(--side-ink);letter-spacing:.04em}
.side-net{stroke:var(--side-ink);stroke-width:7}
.side-trail{fill:none;stroke:var(--side-ink);stroke-width:3;stroke-dasharray:3 9;stroke-linecap:round}
.side-sh{fill:var(--ink)}
.lbl-half{font:600 22px var(--f-display);letter-spacing:.14em;fill:var(--muted)}
.arrow{stroke-width:6;fill:none;stroke-linecap:round}
.arrow.n{stroke:var(--m-neutral);stroke-dasharray:12 10}
.tgt circle{stroke:var(--mat-edge);stroke-width:3}
.tgt text{font:700 26px var(--f-display);fill:#16201C}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><small>Badminton</small>Daily Coach</div>
    <div class="stats">
      <button class="lang" id="lang" type="button">EN</button>
      <div class="stat"><b id="rating">1200</b><small id="l-rating">Wertung</small></div>
      <div class="stat"><b id="streak">0</b><small id="l-streak">Serie</small></div>
    </div>
  </header>
  <section class="home" id="home"></section>
  <div class="playbar" id="playbar" hidden><button class="backbtn" id="backbtn" type="button">←</button><nav class="dots" id="dots" aria-label="Rätsel"></nav><span class="pmode" id="pmode"></span></div>
  <main class="main" id="main" hidden>
    <section class="board">
      <div class="legend">
        <div class="keys"><span><i style="background:var(--you)"></i><span id="l-you">Du · P Partner</span></span><span><i style="background:var(--opp)"></i><span id="l-opp">A, B Gegner</span></span></div>
        <div class="ctrls"><div class="seg" role="group" aria-label="Ansicht"><button type="button" data-v="0" aria-pressed="true">2D</button><button type="button" data-v="1" aria-pressed="false">3D</button></div><button class="replay" id="replay" type="button" aria-label="Ballflug nochmal ansehen">↻</button></div>
      </div>
      <svg id="svg" viewBox="-48 -56 1030 1446" role="img" aria-label="Badmintonfeld von oben, daneben die Flughöhe des Balls von der Seite"></svg>
      <div id="three" hidden><div class="load3" id="load3">3D wird geladen …</div><div class="hint3" id="l-drag">Ziehen zum Drehen</div></div>
    </section>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
// Feldmaße in cm. x: 0–610 (Breite), y: 0–1340 (Länge). Netz bei y=670. Deine Hälfte: y>670.
const PUZ_DE = [
 {id:'serve-base', theme:'Aufschlag', title:'Hinter dem Aufschläger', rating:950,
  lesson:'Der Aufschläger deckt das Netz. Der Partner wartet mittig dahinter und deckt Push und Flick nach hinten.',
  steps:[{type:'place', who:'Y',
   players:{Y:[470,1185],P:[330,895],A:[235,440],B:[300,200]},
   shuttle:{from:[326,885,110],to:[255,465,140],peak:175},
   q:'Dein Partner schlägt kurz auf. Tippe, wo du für den Return stehen solltest.',
   best:[300,1070], rBest:75, rGood:140,
   why:{best:'Mittig hinter dem Aufschläger, etwa auf halber Tiefe. Dein Partner deckt das Netz, du deckst Push und Flick nach hinten. Aus der Mitte sind beide hinteren Ecken gleich weit entfernt.',
        good:'Knapp. Stell dich genau in die Mitte, damit beide hinteren Ecken gleich weit weg sind.'}}]},

 {id:'tape', theme:'Netzspiel', title:'Über der Netzkante', rating:1000,
  lesson:'Über der Netzkante: nach unten schlagen. Unter der Netzkante: Netzdrop oder Lift.',
  steps:[{type:'shot',
   players:{Y:[345,775],P:[300,1120],A:[280,560],B:[330,330]},
   shuttle:{from:[280,600,90],to:[330,700,172],peak:205},
   q:'A spielt einen Netzdrop, der zu hoch kommt. Du triffst den Ball knapp über der Netzkante. Was spielst du?',
   options:[
    {t:'Push nach unten in die Lücke', d:[470,420], g:'best', why:'Über der Netzkante kannst du nach unten schlagen. Ein schneller Push in die Lücke zwischen beiden erzwingt einen schwachen Lift, den dein Partner smashen kann.'},
    {t:'Enger Netzdrop', d:[320,630], g:'good', why:'Nicht falsch, aber du verschenkst die Chance, nach unten zu schlagen. Heb ihn dir auf, wenn der Ball schon unter die Netzkante gefallen ist.'},
    {t:'Cross-Netzdrop', d:[120,630], g:'inacc', why:'Der lange Weg entlang des Netzes gibt A Zeit, hinüberzugehen. Als Überraschung möglich, aber riskanter als nach unten zu schlagen.'},
    {t:'Lift nach hinten', d:[300,90], g:'mistake', why:'Du hattest den Ball über der Netzkante und hast daraus Verteidigung für dein Team gemacht.'}]}]},

 {id:'stay-front', theme:'Rotation', title:'Lift über den Vorderspieler', rating:1000,
  lesson:'Der Vorderspieler bleibt vorne. Alles dahinter gehört dem Hinterspieler.',
  steps:[{type:'place', who:'Y',
   players:{Y:[300,800],P:[210,1130],A:[300,560],B:[440,320]},
   shuttle:{from:[300,580,80],to:[500,1250,230],peak:560},
   q:'A liftet hoch über dich in deine hintere Vorhandecke. Dein Partner läuft hin. Tippe, wo du stehen solltest.',
   best:[350,860], rBest:75, rGood:140,
   why:{best:'Bleib vorne nahe dem T, leicht zur Seite des Balls verschoben. Dein Partner greift von hinten an, du übernimmst alles Kurze. Läufst du nach hinten, ist das ganze Vorderfeld offen.',
        good:'Richtige Zone. Verschieb dich leicht zu der Seite, von der dein Partner schlägt: Gerade Returns kommen dorthin zurück.'}}]},

 {id:'lift-side', theme:'Rotation', title:'Verteidigen nach einem Lift', rating:1100,
  lesson:'Nach einem Lift verteidigt ihr nebeneinander. Gegen einen Cross-Smash spielst du gerade zurück.',
  steps:[

function buildPuzzles(){const lvl=PREFS.level, tol=TOL[lvl]||1;

      if(o){ if(o.best) s.best=o.best; if(o.targets) for(const k in o.targets) s.targets[k].best=o.targets[k];

const SHOT_KIND={high:{peak:620,p:1},half:{peak:320,p:1},smash:{peak:0,p:1.8},drop:{peak:0,p:2.2},
  drive:{peak:0,p:2.5},push:{peak:0,p:2},net:{peak:0,p:1.5},block:{peak:0,p:1.5}};
function kindOf(o){if(o.k)return o.k;const t=o.t.toLowerCase();
  if(t.includes('halbhoh'))return 'half'; if(t.includes('smash'))return 'smash'; if(t.includes('netzdrop'))return 'net';

function shotPath(o,from){

  const A=Math.max(0,K.peak-h0); let B=0, q=1;

function camera(){const t={x:0,y:1.5,z:.6};

function drawPoly(g,C,pts,fill,alpha,stroke,lw){const q=pts.map(p=>P3(p,C));if(q.some(x=>!x))return;

function dirHint(tap,best){
  const dx=tap[0]-best[0], dy=tap[1]-best[1], p=[];
  if(dy>45)p.push(T.back); if(dy<-45)p.push(T.front);
  if(dx>45)p.push(T.right); if(dx<-45)p.push(T.left);
  if(!p.length)return '';const t=p.join(T.and);return t[0].toUpperCase()+t.slice(1)+'.';
}

const LAUNCH=new Date(2026,9,1);
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function yesterdayStr(){const n=new Date();return todayStr(new Date(n.getFullYear(),n.getMonth(),n.getDate()-1));}
function dayIndex(){const n=new Date();return Math.max(0,Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-LAUNCH)/864e5));}
function seeded(a,seed){a=a.slice();let x=seed;const r=()=>{x=(x*1664525+1013904223)%4294967296;return x/4294967296;};
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const LVL_MIX={beg:[3,2,0],int:[2,2,1],adv:[1,2,2]};
function tierOf(p){return p.rating<=1050?0:p.rating<1250?1:2;}
function prefKey(){return PREFS.discs.slice().sort().join('')+'-'+PREFS.level;}
function dailyIds(d){
  const pool=PUZ_DE.filter(p=>PREFS.discs.includes(p.disc||'d'));
  let seed=7;for(const c of PREFS.discs.slice().sort().join(''))seed=(seed*31+c.charCodeAt(0))%100000;
  const tiers=[0,1,2].map(t=>seeded(pool.filter(p=>tierOf(p)===t).map(p=>p.id),seed+11+t));
  const want=LVL_MIX[PREFS.level]||LVL_MIX.int, order=[[0,1,2],[1,0,2],[2,1,0]], out=[];
  want.forEach((n,t)=>{for(let j=0;j<n;j++){for(const tt of order[t]){const L=tiers[tt].filter(id=>!out.includes(id));if(L.length){out.push(L[(d*Math.max(n,1)+j)%L.length]);break;}}}});
  const rt=id=>PUZ_DE.find(p=>p.id===id).rating;
  return out.sort((a,b)=>rt(a)-rt(b));}
function getDaily(){let dd=store.get('daily',null);const t=todayStr(),key=prefKey();
  if(!dd||dd.date!==t||dd.key!==key){const d=dayIndex();dd={date:t,day:d+1,key,ids:dailyIds(d),res:{}};store.set('daily',dd);}return dd;}
function streakNow(){const k=store.get('streakDays',{n:0,last:null});return (k.last===todayStr()||k.last===yesterdayStr())?k.n:0;}
function bumpStreak(){const k=store.get('streakDays',{n:0,last:null}),t=todayStr();if(k.last===t)return;
  k.n=(k.last===yesterdayStr()?k.n:0)+1;k.last=t;store.set('streakDays',k);}

  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const q=pt.matrixTransform(svg.getScreenCTM().inverse());
  placeAt(q.x,q.y);
});
document.getElementById('replay').addEventListener('click',()=>{if(S.paused)play();else pause();});
panel.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const st=ST();
  if(b.dataset.opt!=null){
    const i=+b.dataset.opt;
    if(!S.answers[S.si]){S.answers[S.si]={i,g:st.options[i].g};S.phase='answered';S.view=null;}
    else S.view=i;
    renderSVG(); renderPanel(); panel.scrollTop=0; return;
  }
  if(b.dataset.who){S.active=b.dataset.who;renderSVG();renderPanel();return;}
  const act=b.dataset.act;
  if(act==='lock'){
    const T=TG(st), per={}; let sum=0;
    for(const [k,t] of Object.entries(T)){const tp=S.taps[k]; if(!tp) return;
      const d=Math.hypot(tp[0]-t.best[0],tp[1]-t.best[1]);
      per[k]=d<=t.rBest?'best':d<=t.rGood?'good':d<=t.rGood*1.8?'inacc':'mistake'; sum+=G[per[k]].v;}
    S.answers[S.si]={g:gradeOf(sum/Object.keys(T).length),per}; S.phase='answered'; renderSVG(); renderPanel(); panel.scrollTop=0;
  }
  if(act==='cont'){ if(S.si<P().steps.length-1) nextStep(); else finish(); }
  if(act==='dnext') openDaily();
  if(act==='pnext'){const k=PRACT.indexOf(S.pi); startPuzzle(PRACT[(k+1)%PRACT.length]);}
  if(act==='retry') startPuzzle(S.pi);
  if(act==='home') showHome();
});
document.getElementById('dots').addEventListener('click',e=>{const b=e.target.closest('.dot');if(!b||b.disabled)return;const i=PUZZLES.findIndex(p=>p.id===b.dataset.id);if(i>=0&&i!==S.pi)startPuzzle(i);});
document.getElementById('backbtn').addEventListener('click',showHome);
document.getElementById('home').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='dstart')openDaily();
  else if(b.dataset.act==='share')shareDaily();
  else if(b.dataset.pf){S.pf=b.dataset.pf;renderHome();}
  else if(b.dataset.act==='editprefs'){S.tmp=JSON.parse(JSON.stringify(PREFS));S.editPrefs=true;renderHome();homeEl.scrollTop=0;}
  else if(b.dataset.act==='cancelprefs'){S.editPrefs=false;renderHome();}
  else if(b.dataset.disc){const k=b.dataset.disc,a=S.tmp.discs;S.tmp.discs=a.includes(k)?a.filter(x=>x!==k):a.concat(k);renderHome();}
  else if(b.dataset.lvl){S.tmp.level=b.dataset.lvl;renderHome();}
  else if(b.dataset.act==='saveprefs'&&S.tmp.discs.length){PREFS={discs:S.tmp.discs,level:S.tmp.level,set:true};store.set('prefs',PREFS);
    PUZZLES=buildPuzzles();S.editPrefs=false;S.tmp=null;renderHeader();renderHome();homeEl.scrollTop=0;}
  else if(b.dataset.pid!=null)openPuzzle(+b.dataset.pid,'practice');});
setInterval(()=>{if(S.screen!=='home')return;const dd=store.get('daily',null);if(!dd||dd.date!==todayStr()){renderHeader();renderHome();return;}
  const e=document.getElementById('cd');if(e&&e.dataset.live)e.textContent=T.newIn(untilMidnight());},30000);

document.getElementById('lang').addEventListener('click',()=>{applyLang(LANG==='de'?'en':'de',true);if(S.screen==='home'){renderHeader();renderHome();}else render();});
document.querySelector('.seg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v==='1');});
showHome();
</script>
</body>
