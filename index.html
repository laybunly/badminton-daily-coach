<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6A52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Coach">
<link rel="icon" type="image/svg+xml" href="./icons/b3.svg">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/b3-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/b1-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/b1-180.png">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Badminton Daily Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><small>Badminton</small>Daily Coach</div>
    <div class="stats">
      <button class="lang" id="lang" type="button" hidden>EN</button>
      <div class="stat"><b id="rating">1200</b><small id="l-rating">Wertung</small></div>
      <div class="stat"><b id="streak">0</b><small id="l-streak">Serie</small></div>
    </div>
  </header>
  <section class="home" id="home"></section>
  <div class="playbar" id="playbar" hidden><button class="backbtn" id="backbtn" type="button">←</button><nav class="dots" id="dots" aria-label="Rätsel"></nav><span class="pmode" id="pmode"></span><button class="replay helpbtn" id="helpbtn" type="button" aria-label="Begriffe">?</button><button class="replay setbtn" id="setbtn" type="button" aria-label="Einstellungen">⚙</button></div>
  <main class="main" id="main" hidden>
    <section class="board">
      <div class="legend">
        <div class="keys"><span><i style="background:var(--you)"></i><span id="l-you">Du · P Partner</span></span><span><i style="background:var(--opp)"></i><span id="l-opp">A, B Gegner</span></span><span class="lh" id="l-hand"></span></div>
        <div class="ctrls"><button class="replay" id="replay" type="button" aria-label="Ballflug nochmal ansehen" hidden>↻</button></div>
      </div>
      <svg id="svg" viewBox="-48 -56 1030 1446" role="img" aria-label="Badmintonfeld von oben, daneben die Flughöhe des Balls von der Seite"></svg>
    </section>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="sheet" id="sheet" hidden><div class="sheet-card" role="dialog" aria-modal="true"><div id="sheet-body"></div><button class="btn" id="sheet-close" type="button">OK</button></div></div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
