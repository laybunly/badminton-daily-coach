<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6A52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Coach">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Badminton Daily Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen trainer. Court + aligned side-view height strip fill the free space; the compact decision panel sits below (phone) or beside (wide) and scrolls on its own, so the court never leaves the screen. */
:root{
  --bg:#E8EEEB; --surface:#FFFFFF; --ink:#15211C; --muted:#56665F; --line:#C9D5D0;
  --mat:#2E6A52; --mat-edge:#1F4D3A; --court-line:#F3F8F5; --side:#D9E4DF; --side-ink:#4A5D55;
  --you:#F2B134; --opp:#E4585D;
  --best:#178C61; --good:#2F6FC6; --inacc:#B07A0E; --mistake:#C93A42;
  --accent:#2E6A52; --on-accent:#FFFFFF;
  --m-best:#8FF5C3; --m-good:#A6CCFF; --m-inacc:#FFD166; --m-mistake:#FF8E93; --m-neutral:rgba(243,248,245,.75);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#16201C; --ink:#E5EDE9; --muted:#98A9A1; --line:#2A3832;
  --mat:#25573F; --mat-edge:#173A2A; --court-line:#E9F1ED; --side:#1B2722; --side-ink:#9DB1A8;
  --you:#F5BC4A; --opp:#EE6A6F;
  --best:#3CC08C; --good:#6AA4F0; --inacc:#E6AC3A; --mistake:#EE6B74;
  --accent:#62C495; --on-accent:#0D1412; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#16201C; --ink:#E5EDE9; --muted:#98A9A1; --line:#2A3832;
  --mat:#25573F; --mat-edge:#173A2A; --court-line:#E9F1ED; --side:#1B2722; --side-ink:#9DB1A8;
  --you:#F5BC4A; --opp:#EE6A6F;
  --best:#3CC08C; --good:#6AA4F0; --inacc:#E6AC3A; --mistake:#EE6B74;
  --accent:#62C495; --on-accent:#0D1412; color-scheme:dark}
html{height:100%;box-sizing:border-box;background:var(--bg)}
body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
*,*::before,*::after{box-sizing:border-box}
.app{height:100%;max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:8px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.brand{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;font:700 20px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font:600 11px/1.1 var(--f-body);letter-spacing:.16em;color:var(--muted)}
.stats{display:flex;gap:6px;align-items:stretch}
.lang{font:700 13px var(--f-body);letter-spacing:.04em;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:0 9px;cursor:pointer}
.lang:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px}
.stat b{font:700 18px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat small{font-size:9px;line-height:1.2;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.delta-up{color:var(--best)} .delta-down{color:var(--mistake)}
.dots{display:flex;gap:5px;overflow-x:auto;flex:none;padding:2px}
.dot{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--muted);font:600 14px var(--f-display);cursor:pointer;padding:0}
.dot.cur{border-color:var(--ink);color:var(--ink)}
.dot.r-best{background:var(--best);border-color:var(--best);color:#fff}
.dot.r-good{background:var(--good);border-color:var(--good);color:#fff}
.dot.r-inacc{background:var(--inacc);border-color:var(--inacc);color:#fff}
.dot.r-mistake{background:var(--mistake);border-color:var(--mistake);color:#fff}
.dot.cur.r-best,.dot.cur.r-good,.dot.cur.r-inacc,.dot.cur.r-mistake{outline:2px solid var(--ink);outline-offset:1px}
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.board{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:4px}
.legend{flex:none;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.legend .keys{display:flex;gap:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.replay{font:600 13px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;flex:none}
#svg{flex:1 1 0;min-height:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.panel{flex:none;max-height:42%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
@media (min-width:760px){
  .main{flex-direction:row}
  .panel{width:380px;max-height:100%;padding:16px;gap:12px}
}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
h2{font:700 22px/1.05 var(--f-display);margin:0;text-wrap:balance}
.meta{font-size:12px;color:var(--muted);white-space:nowrap}
.q{margin:0;font-size:15px}
.q .step{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:500 14px/1.25 var(--f-body);color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:9px;padding:7px 8px;cursor:pointer;min-width:0}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--mat);color:#fff;font:700 14px var(--f-display)}
.opt .lbl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.g{align-self:flex-start;font:600 10px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 5px;border-radius:4px;color:#fff}
.opt.sel{border-color:var(--ink)}
.opt.view{background:var(--surface);border-color:var(--line)}
.g-best{background:var(--best)} .g-good{background:var(--good)} .g-inacc{background:var(--inacc)} .g-mistake{background:var(--mistake)}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--f-body);color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:999px;padding:5px 12px;cursor:pointer}
.chip.on{border-color:var(--ink);background:var(--surface)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--you)}
.per{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:0}
.verdict{border-radius:9px;padding:8px 10px;background:var(--bg);display:flex;flex-direction:column;gap:5px;font-size:14px}
.verdict .badge{align-self:flex-start;font:700 15px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:#fff;padding:5px 8px;border-radius:5px}
.verdict p{margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stick{position:sticky;bottom:-10px;background:var(--surface);padding-block:6px 2px;margin-top:-2px}
.btn{font:600 15px var(--f-body);border-radius:9px;padding:9px 16px;cursor:pointer;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.opt:focus-visible,.dot:focus-visible,.chip:focus-visible,.replay:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.lesson{border-left:4px solid var(--accent);padding:2px 0 2px 10px;font-size:15px;font-weight:500}
.score{font:700 36px/1 var(--f-display);font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--muted);margin:0}
#three{flex:1 1 0;min-height:0;position:relative;touch-action:none;border-radius:12px;overflow:hidden}
#three canvas{display:block;width:100%;height:100%}
.hint3{position:absolute;left:8px;bottom:8px;font-size:11px;color:#fff;background:rgba(0,0,0,.5);padding:3px 9px;border-radius:999px;pointer-events:none}
.load3{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.ctrls{display:flex;gap:6px;align-items:center;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{font:600 13px var(--f-body);padding:4px 11px;border:0;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:3px solid var(--good);outline-offset:-3px}
/* home */
.home{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:16px}
.hero{background:var(--mat);color:#F3F8F5;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero .eyebrow{font:600 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.hero h1{font:700 32px/1 var(--f-display);margin:0;text-wrap:balance}
.hero p{margin:0;opacity:.92}
.sqs{display:flex;gap:8px}
.sq{width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35)}
.hero .sq.r-best{background:var(--m-best);border-color:var(--m-best)} .hero .sq.r-good{background:var(--m-good);border-color:var(--m-good)}
.hero .sq.r-inacc{background:var(--m-inacc);border-color:var(--m-inacc)} .hero .sq.r-mistake{background:var(--m-mistake);border-color:var(--m-mistake)}
.btn.light{background:#F3F8F5;color:#173A2A;border-color:#F3F8F5;font-size:17px;padding:12px 24px;align-self:flex-start}
.bigscore{font:700 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.cd{font-size:13px;opacity:.85}
.sharebox{width:100%;min-height:96px;font:14px/1.4 var(--f-body);border-radius:8px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.25);color:#F3F8F5;padding:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font:700 22px/1.1 var(--f-display)}
.lrow{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.lrow b{display:block;font-size:15px}
.lrow .sq{width:16px;height:16px;border-radius:4px;flex:none;margin-top:3px;border:0}
.card .sq.r-best{background:var(--best)} .card .sq.r-good{background:var(--good)} .card .sq.r-inacc{background:var(--inacc)} .card .sq.r-mistake{background:var(--mistake)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);border:0;border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink);font:600 15px var(--f-body)}
.prow .pt{flex:1;min-width:0} .prow small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.prow:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.g-new{background:var(--muted)}
.playbar{display:flex;align-items:center;gap:8px;flex:none;min-width:0}
.playbar .dots{flex:1;min-width:0;gap:4px}
.playbar .dot{width:26px;height:26px;font-size:13px}
.playbar{gap:6px}
.playbar .backbtn{min-width:36px;padding:4px 0;font-size:17px;line-height:1.2}
.backbtn{flex:none;font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.backbtn:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.pmode{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dot[disabled]{cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;max-width:90vw;text-align:center}
.plabel{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.levels{display:grid;gap:6px}
.lvl{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--bg);border:2px solid transparent;border-radius:10px;padding:10px 12px;color:var(--ink);cursor:pointer;font:600 15px var(--f-body)}
.lvl span{font-size:13px;font-weight:400;color:var(--muted)}
.lvl.on{border-color:var(--ink);background:var(--surface)}
.lvl:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.chip[disabled]{opacity:.5;cursor:default}
.prefline{font-size:14px}
.linkbtn{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}
.alley{fill:#000;opacity:.22}
.eb{font:600 11px/1.35 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.panel .badge{align-self:flex-start;font:700 15px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:#fff;padding:5px 8px;border-radius:5px}
.ochips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ochip{width:34px;height:34px;border-radius:50%;border:2px solid transparent;font:700 15px var(--f-display);color:#16201C;cursor:pointer;padding:0}
.ochip.on{border-color:var(--ink)}
.ochip:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.home.center{justify-content:center}
.hero-big{padding:28px 22px;gap:16px}
.hero-big h1{font-size:40px}
.btn.big{align-self:stretch;font-size:19px;padding:16px 24px;border-radius:12px}
.linkrow{align-self:center;background:none;border:0;color:var(--ink);font:600 15px var(--f-body);text-decoration:underline;text-underline-offset:3px;padding:12px;cursor:pointer}
.linkrow:focus-visible{outline:3px solid var(--good);outline-offset:2px}
details.lessons summary{font:700 20px/1.1 var(--f-display);cursor:pointer}
details.lessons[open] summary{margin-bottom:6px}
.term{display:inline;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:help}
.term:focus-visible{outline:2px solid var(--good);outline-offset:1px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet-card{background:var(--surface);color:var(--ink);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:75%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sheet-card h3{margin:0;font:700 24px/1.1 var(--f-display)}
.sheet-card p{margin:0}
.sheet-card .plabel{margin-top:6px}
.sheet-card .btn{align-self:stretch}
.gl-list{display:flex;flex-direction:column;gap:10px;font-size:14px}
.gl-item b{display:block;font-size:15px}
.helpbtn{margin-left:auto;font-weight:700;min-width:32px}
.setbtn{min-width:32px;font-size:16px}
.links{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.bestbox{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;display:flex;flex-direction:column;gap:5px}
.clist{display:flex;flex-direction:column;gap:8px}
.ccard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--bg);border:0;border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.ccard b{font:700 19px/1.1 var(--f-display)}
.ccard:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.pbar{display:block;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.mini{display:inline-flex;gap:4px;margin-top:4px}
.mini span{width:12px;height:12px;border-radius:3px;background:var(--line)}
.mini .r-best{background:var(--best)} .mini .r-good{background:var(--good)} .mini .r-inacc{background:var(--inacc)} .mini .r-mistake{background:var(--mistake)}
.legend .lh{font-style:italic;font-size:11px}
.legend .keys{gap:4px 9px}
.codebox{font:700 40px/1 var(--f-display);letter-spacing:.12em;text-align:center;padding:14px;border-radius:12px;background:var(--bg);font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all}
.linkline{word-break:break-all;user-select:all;-webkit-user-select:all}
.sharebox.dark{background:var(--bg);color:var(--ink);border-color:var(--line)}
.codeform{display:flex;flex-direction:column;gap:6px}
#codein{flex:1;min-width:0;font:700 18px var(--f-display);letter-spacing:.12em;text-transform:uppercase;padding:9px 12px;border-radius:9px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
#codein:focus-visible{outline:3px solid var(--good);outline-offset:1px}
.ebrow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.sharelink{flex:none;background:none;border:0;padding:0 0 0 4px;font:600 12px/1.35 var(--f-body);color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.sharelink:focus-visible{outline:2px solid var(--good)}
.ebacts{display:flex;gap:10px;flex:none}
.repc{width:100%;font:15px/1.4 var(--f-body);border-radius:9px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 10px;resize:vertical}
.repc:focus-visible{outline:3px solid var(--good);outline-offset:1px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.tok.ideal circle{fill:var(--court-line);stroke:var(--mat-edge);stroke-width:4}
.tok.ideal text{fill:#16201C}
.corr-line{stroke:var(--court-line);stroke-width:4;stroke-dasharray:6 8;stroke-linecap:round;opacity:.9}
/* svg */
.mat{fill:var(--mat)} .cl{stroke:var(--court-line);stroke-width:5;fill:none}
.net{stroke:var(--court-line);stroke-width:9}
.myhalf{fill:var(--court-line);opacity:0} .myhalf.on{opacity:.07}
.tok circle{stroke:var(--mat-edge);stroke-width:4}
.tok.y circle{fill:var(--you)} .tok.o circle{fill:var(--opp)}
.tok text{font:700 50px var(--f-display);fill:#1A1A1A} .tok.o text{fill:#FFFFFF}
.tok.faded{opacity:.35} .tok.faded circle{stroke-dasharray:7 6}
.tok.ghost circle{fill:none;stroke:var(--court-line);stroke-width:4;stroke-dasharray:8 6} .tok.ghost text{fill:var(--court-line)}
.zone-good{fill:none;stroke:var(--court-line);stroke-width:3;stroke-dasharray:10 8;opacity:.8}
.zone-best{fill:var(--court-line);fill-opacity:.2;stroke:var(--court-line);stroke-width:3}
.ring{fill:none;stroke:var(--you);stroke-width:5}
.trail{fill:none;stroke:var(--court-line);stroke-width:3;stroke-dasharray:3 10;stroke-linecap:round;opacity:.7}
.side-bg{fill:var(--side)} .side-grid{stroke:var(--side-ink);stroke-width:1.5;opacity:.35;stroke-dasharray:4 8}
.side-txt{font:600 28px var(--f-display);fill:var(--side-ink);letter-spacing:.04em}
.side-net{stroke:var(--side-ink);stroke-width:7}
.side-trail{fill:none;stroke:var(--side-ink);stroke-width:3;stroke-dasharray:3 9;stroke-linecap:round}
.side-sh{fill:var(--ink)}
.lbl-half{font:600 22px var(--f-display);letter-spacing:.14em;fill:var(--muted)}
.arrow{stroke-width:6;fill:none;stroke-linecap:round}
.arrow.n{stroke:var(--m-neutral);stroke-dasharray:12 10}
.tgt circle{stroke:var(--mat-edge);stroke-width:3}
.tgt text{font:700 26px var(--f-display);fill:#16201C}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><small>Badminton</small>Daily Coach</div>
    <div class="stats">

  GEN.push({id,disc:'t',cat:c,set:s,theme:CATS[c].de,title:o.title[0],rating:rateOf(s,n),lesson:o.lesson[0],
    steps:[{type:'shot',players:o.players,shuttle:o.shuttle,q:o.q[0],options:o.opts.map(x=>{const r={t:x[0],d:x[2],g:x[3],why:x[4]};if(x[6])r.k=x[6];return r;})}]});
  GEN_EN[id]={theme:CATS[c].en,title:o.title[1],lesson:o.lesson[1],steps:[{q:o.q[1],opts:o.opts.map(x=>[x[1],x[5]])}]};}
function mkPlace(c,s,n,o){const id=`t-${CATS[c].k}-${s+1}-${n+1}`, st={type:'place',players:o.players,shuttle:o.shuttle,q:o.q[0],why:{best:o.why[0],good:o.good[0]}};
  if(o.bh) st.bhY=true;
  if(o.targets) st.targets=Object.fromEntries(Object.entries(o.targets).map(([k,v])=>[k,{best:v,rBest:o.rb||70,rGood:o.rg||130}]));
  else {st.who=o.who;st.best=o.best;st.rBest=o.rb||70;st.rGood=o.rg||130;}
  GEN.push({id,disc:'t',cat:c,set:s,theme:CATS[c].de,title:o.title[0],rating:rateOf(s,n),lesson:o.lesson[0],steps:[st]});
  GEN_EN[id]={theme:CATS[c].en,title:o.title[1],lesson:o.lesson[1],steps:[{q:o.q[1],why:{best:o.why[1],good:o.good[1]}}]};}

function handText(t){if(!t)return t;const sw=w=>({Vorhand:'Rückhand',Rückhand:'Vorhand',forehand:'backhand',backhand:'forehand',Forehand:'Backhand',Backhand:'Forehand'})[w]||w;

  const arr=JSON.parse(JSON.stringify(LANG==='de'?PUZ_DE:PUZ_EN));

    p.steps.forEach((s,si)=>{const o=base.steps[si].lv&&base.steps[si].lv[lvl];
      if(o){ if(o.best) s.best=o.best; if(o.targets) for(const k in o.targets) s.targets[k].best=o.targets[k];
        if(o.why) s.why=o.why[LANG];

      if(PREFS.hand==='L'){s.q=handText(s.q); if(s.why) s.why={best:handText(s.why.best),good:handText(s.why.good)}; if(s.options) s.options.forEach(op=>{op.t=handText(op.t);op.why=handText(op.why);});}

        if(s.why) s.why={...s.why,best:s.why.best+(LANG==='de'?` Als ${PREFS.hand==='L'?'Linkshänder':'Rechtshänder'} stehst du dabei leicht zur Rückhandseite, damit mehr Bälle auf deine Vorhand kommen.`:` As a ${PREFS.hand==='L'?'left':'right'}-hander, stand slightly toward your backhand side so more shuttles come to your forehand.`)};}
      if(s.options){let hh=0;for(const ch of p.id+si)hh=(hh*31+ch.charCodeAt(0))%100000;s.options=seeded(s.options,hh+3);}

function shPos(sh,t){const [x0,y0,h0]=sh.from,[x1,y1,h1]=sh.to;
  const bump=Math.max(0,sh.peak-Math.max(h0,h1))*4*t*(1-t);
  return [x0+(x1-x0)*t, y0+(y1-y0)*t, h0+(h1-h0)*t+bump];}
function trail(sh,side){let d='';for(let i=0;i<=30;i++){const [x,y,h]=shPos(sh,i/30);d+=(i?'L':'M')+(side?(SX+h*HS).toFixed(1):x.toFixed(1))+' '+y.toFixed(1);}return d;}

  if(st.type==='shot'){
    const [cx,cy]=sh.to;

      const [tx,ty]=o.d, L=Math.hypot(tx-cx,ty-cy), ex=tx-(tx-cx)/L*34, ey=ty-(ty-cy)/L*34;
      const k=answered?o.g:'n', col=answered?MAT[o.g]:'var(--m-neutral)';

const MATC={best:'#8FF5C3',good:'#A6CCFF',inacc:'#FFD166',mistake:'#FF8E93'};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#ffffff';}
function W(x,y,h){return {x:(x-305)/100,y:(h||0)/100,z:(y-670)/100};}
const vsub=(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}), vdot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const vcross=(a,b)=>({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x});
const vnorm=a=>{const l=Math.hypot(a.x,a.y,a.z)||1;return {x:a.x/l,y:a.y/l,z:a.z/l};};
const vadd=(a,b,s=1)=>({x:a.x+b.x*s,y:a.y+b.y*s,z:a.z+b.z*s});

// Flugkurve einer Schlagoption: Start auf Treffhöhe, Landung am Ziel, über das Netz gehoben.
const SHOT_KIND={high:{peak:620,p:1},half:{peak:320,p:1},smash:{peak:0,p:1.8},drop:{peak:0,p:2.2},
  drive:{peak:0,p:2.5},push:{peak:0,p:2},net:{peak:0,p:1.5},block:{peak:0,p:1.5}};
function kindOf(o){if(o.k)return o.k;const t=o.t.toLowerCase();
  if(t.includes('halbhoh'))return 'half'; if(t.includes('smash'))return 'smash'; if(t.includes('netzdrop'))return 'net';
  if(t.includes('drop'))return 'drop'; if(t.includes('drive'))return 'drive'; if(t.includes('push'))return 'push';
  if(t.includes('block'))return 'block'; if(t.includes('clear')||t.includes('lift'))return 'high'; return 'drive';}
function shotPath(o,from){
  const K=SHOT_KIND[kindOf(o)]||SHOT_KIND.drive, [x0,y0,h0]=from, [x1,y1]=o.d;
  const A=Math.max(0,K.peak-h0); let B=0, q=1;
  const f=t=>[x0+(x1-x0)*t, y0+(y1-y0)*t, h0*(1-Math.pow(t,K.p))+A*4*t*(1-t)+B*Math.sin(Math.PI*Math.pow(t,q))];
  if((y0-670)*(y1-670)<0){const tn=Math.min(.95,Math.max(.05,(y0-670)/(y0-y1)));
    q=Math.log(.5)/Math.log(tn); const need=172-f(tn)[2]; if(need>0)B=need;}
  return f;
}

function init3D(){
  const cv=document.createElement('canvas'), ctx=cv.getContext('2d');
  if(!ctx) throw new Error('no canvas');
  box3.insertBefore(cv,box3.firstChild);
  R3={cv,ctx,az:0,el:.62,rad:16,w:1,h:1,dpr:1,items:[],obj:[],sh:null};
  if(window.ResizeObserver) new ResizeObserver(()=>resize3D()).observe(box3); else window.addEventListener('resize',resize3D);
  let pd=null;
  cv.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,az:R3.az,el:R3.el,drag:false};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y;
    if(!pd.drag&&Math.hypot(dx,dy)>10)pd.drag=true;
    if(pd.drag){R3.az=Math.max(-1.6,Math.min(1.6,pd.az-dx*.008));R3.el=Math.max(.15,Math.min(1.45,pd.el+dy*.006));draw3();}});
  cv.addEventListener('pointerup',e=>{if(pd&&!pd.drag){const r=cv.getBoundingClientRect();const p=floorAt(e.clientX-r.left,e.clientY-r.top);if(p)placeAt(p[0],p[1]);}pd=null;});
  cv.addEventListener('pointercancel',()=>{pd=null;});
}
function resize3D(){if(!R3)return;const w=box3.clientWidth,h=box3.clientHeight;if(!w||!h)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);R3.w=w;R3.h=h;R3.dpr=dpr;
  R3.cv.width=Math.round(w*dpr);R3.cv.height=Math.round(h*dpr);R3.cv.style.width=w+'px';R3.cv.style.height=h+'px';
  const a=w/h;R3.rad=(a<1?15+(1-a)*17:15)*1.12;draw3();}
function camera(){const t={x:0,y:1.5,z:.6};
  const c={x:t.x+R3.rad*Math.sin(R3.az)*Math.cos(R3.el),y:t.y+R3.rad*Math.sin(R3.el),z:t.z+R3.rad*Math.cos(R3.az)*Math.cos(R3.el)};
  const f=vnorm(vsub(t,c)), r=vnorm(vcross(f,{x:0,y:1,z:0})), u=vcross(r,f);
  return {c,f,r,u,focal:(R3.h/2)/Math.tan(20*Math.PI/180)};}
function P3(p,C){const d=vsub(p,C.c), z=vdot(d,C.f); if(z<.2) return null;
  return {x:R3.w/2+vdot(d,C.r)/z*C.focal, y:R3.h/2-vdot(d,C.u)/z*C.focal, z};}
function floorAt(sx,sy){const C=camera();
  const d=vadd(vadd(C.f,C.r,(sx-R3.w/2)/C.focal),C.u,-(sy-R3.h/2)/C.focal); if(d.y>=-1e-4) return null;
  const t=-C.c.y/d.y, p=vadd(C.c,d,t); return [p.x*100+305,p.z*100+670];}
function circlePts(c,r,n=40){const a=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2;a.push({x:c.x+Math.cos(t)*r,y:c.y,z:c.z+Math.sin(t)*r});}return a;}

// Zeichen-Bausteine (in Bildschirm-Pixeln, Weltmaße per Perspektive skaliert)
function drawPoly(g,C,pts,fill,alpha,stroke,lw){const q=pts.map(p=>P3(p,C));if(q.some(x=>!x))return;
  g.globalAlpha=alpha==null?1:alpha;g.beginPath();q.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();
  if(fill){g.fillStyle=fill;g.fill();} if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||1;g.stroke();} g.globalAlpha=1;}
function drawLine3(g,C,a,b,ww,col,alpha,dash){const n=8;g.strokeStyle=col;g.globalAlpha=alpha==null?1:alpha;g.lineCap='round';
  if(dash)g.setLineDash(dash);
  for(let i=0;i<n;i++){const p0=P3(vadd(a,vsub(b,a),i/n),C),p1=P3(vadd(a,vsub(b,a),(i+1)/n),C);if(!p0||!p1)continue;
    g.lineWidth=Math.max(1,ww*C.focal/((p0.z+p1.z)/2));g.beginPath();g.moveTo(p0.x,p0.y);g.lineTo(p1.x,p1.y);g.stroke();}
  g.setLineDash([]);g.globalAlpha=1;}
function drawCurve(g,C,pts,ww,col,alpha,dash,arrow){const q=pts.map(p=>P3(p,C)).filter(Boolean);if(q.length<2)return;
  g.strokeStyle=col;g.globalAlpha=alpha==null?1:alpha;g.lineCap='round';g.lineJoin='round';if(dash)g.setLineDash(dash);
  g.lineWidth=Math.max(1.5,ww*C.focal/q[Math.floor(q.length/2)].z);
  g.beginPath();q.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke();g.setLineDash([]);
  if(arrow){const a=q[q.length-1],b=q[q.length-4]||q[0],ang=Math.atan2(a.y-b.y,a.x-b.x),s=Math.max(8,.28*C.focal/a.z);
    g.fillStyle=col;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(a.x-s*Math.cos(ang-.45),a.y-s*Math.sin(ang-.45));g.lineTo(a.x-s*Math.cos(ang+.45),a.y-s*Math.sin(ang+.45));g.closePath();g.fill();}
  g.globalAlpha=1;}
function drawLabel(g,x,y,text,bg,fg,px){g.font=`700 ${px}px "Barlow Condensed","Arial Narrow",sans-serif`;
  const w=g.measureText(text).width+px*.9,h=px*1.35;g.fillStyle=bg;g.beginPath();
  if(g.roundRect)g.roundRect(x-w/2,y-h/2,w,h,h/2);else g.rect(x-w/2,y-h/2,w,h);g.fill();
  g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';g.fillText(text,x,y+px*.05);}
function drawPlayer(g,C,it){const f=P3(it.p,C),t=P3(vadd(it.p,{x:0,y:1.15,z:0}),C),hd=P3(vadd(it.p,{x:0,y:1.33,z:0}),C);if(!f||!t||!hd)return;
  const s=C.focal/f.z, bw=.5*s, tw=.4*s, hr=.17*s;
  if(it.mode==='solid')drawPoly(g,C,circlePts(it.p,.32,24),'#000',.22);
  g.globalAlpha=it.mode==='faded'?.32:it.mode==='ghost'?.9:1;
  const fill=it.mode==='ghost'?'rgba(255,255,255,.22)':it.col;
  g.fillStyle=fill;g.strokeStyle=it.mode==='ghost'?'#F3F8F5':'rgba(0,0,0,.35)';g.lineWidth=it.mode==='ghost'?2:1.2;
  if(it.mode!=='solid')g.setLineDash([5,4]);
  g.beginPath();g.moveTo(f.x-bw/2,f.y);g.lineTo(t.x-tw/2,t.y);g.lineTo(t.x+tw/2,t.y);g.lineTo(f.x+bw/2,f.y);g.closePath();g.fill();g.stroke();
  g.beginPath();g.arc(hd.x,hd.y,hr,0,Math.PI*2);g.fill();g.stroke();g.setLineDash([]);g.globalAlpha=1;
  if(it.mode!=='faded'){const lp=P3(vadd(it.p,{x:0,y:1.85,z:0}),C);if(lp)drawLabel(g,lp.x,lp.y,it.label,it.mode==='ghost'?'rgba(255,255,255,.92)':it.col,it.mode==='ghost'?'#1A1A1A':it.fg,13);}}

  [[0,0,610,0],[0,1340,610,1340],[0,0,0,1340],[610,0,610,1340],[46,0,46,1340],[564,0,564,1340],[0,76,610,76],[0,1264,610,1264],
   [0,472,610,472],[0,868,610,868],[305,0,305,472],[305,868,305,1340]].forEach(l=>it.push({k:'line',a:W(l[0],l[1]),b:W(l[2],l[3]),w:.04,col:line}));

  const tr=[];for(let i=0;i<=40;i++){const [x,y,h]=shPos(sh,i/40);tr.push(W(x,y,h));}
  obj.push({k:'curve',pts:tr,w:.025,col:'#FFFFFF',a:.75,dash:[6,6]});
  const you=css('--you'), opp=css('--opp');
  if(st.type==='place'&&answered) for(const [k,t] of Object.entries(TG(st))) obj.push({k:'player',p:W(t.best[0],t.best[1]),mode:'ghost',label:LABEL[k]});
  for(const [k,v] of Object.entries(st.players)){
    const mine=(k==='Y'||k==='P'), base={col:mine?you:opp,fg:mine?'#1A1A1A':'#FFFFFF',label:LABEL[k]};

      obj.push({...base,k:'player',p:W(v[0],v[1]),mode:'faded'});
      const tp=S.taps[k]; if(tp) obj.push({...base,k:'player',p:W(tp[0],tp[1]),mode:'solid'});
      if(S.phase==='play'&&S.active===k&&Object.keys(TG(st)).length>1){const c=tp||v;it.push({k:'ring',c:W(c[0],c[1]),r:.43,col:you,a:1,w:.08});}
    } else obj.push({...base,k:'player',p:W(v[0],v[1]),mode:'solid'});
  }
  if(st.type==='shot'){const y=st.players.Y;it.push({k:'ring',c:W(y[0],y[1]),r:.43,col:you,a:1,w:.08});}
  R3.items=it; R3.obj=obj;
}
function draw3(){
  if(!R3||!R3.w)return;
  const g=R3.ctx, C=camera();
  g.setTransform(R3.dpr,0,0,R3.dpr,0,0); g.fillStyle=css('--bg'); g.fillRect(0,0,R3.w,R3.h);
  for(const it of R3.items){
    if(it.k==='poly') drawPoly(g,C,it.pts,it.fill,it.a);
    else if(it.k==='line') drawLine3(g,C,it.a,it.b,it.w,it.col,it.al);
    else if(it.k==='circle') drawPoly(g,C,circlePts(it.c,it.r),it.fill,it.a);
    else if(it.k==='ring') drawPoly(g,C,circlePts(it.c,it.r,48),null,it.a,it.col,Math.max(1.5,(it.w||.04)*C.focal/(P3(it.c,C)||{z:15}).z));
  }
  const sp=R3.sh;
  if(sp){drawPoly(g,C,circlePts({x:sp.x,y:0,z:sp.z},.12,20),'#000',.38);}
  // Netz: Pfosten, Netzfläche, Netzkante
  drawLine3(g,C,{x:-3.1,y:0,z:0},{x:-3.1,y:1.55,z:0},.05,'#D6DBD8');
  drawLine3(g,C,{x:3.1,y:0,z:0},{x:3.1,y:1.55,z:0},.05,'#D6DBD8');
  drawPoly(g,C,[{x:-3.1,y:.79,z:0},{x:3.1,y:.79,z:0},{x:3.1,y:1.55,z:0},{x:-3.1,y:1.55,z:0}],'#0C110F',.42);
  drawLine3(g,C,{x:-3.1,y:1.53,z:0},{x:3.1,y:1.53,z:0},.05,'#FFFFFF');
  const obj=R3.obj.map(o=>{const q=P3(o.k==='curve'?o.pts[Math.floor(o.pts.length/2)]:o.p,C);return {o,z:q?q.z:0};});
  if(sp) obj.push({o:{k:'shuttle'},z:(P3(sp,C)||{z:0}).z});
  obj.sort((a,b)=>b.z-a.z);
  const labels=[];
  for(const {o} of obj){
    if(o.k==='curve') drawCurve(g,C,o.pts,o.w,o.col,o.a,o.dash,o.arrow);
    else if(o.k==='player') drawPlayer(g,C,o);
    else if(o.k==='label') labels.push(o);
    else if(o.k==='shuttle'){
      drawLine3(g,C,sp,{x:sp.x,y:0,z:sp.z},.012,'#FFFFFF',.7,[4,4]);
      const q=P3(sp,C); if(q){const r=Math.max(4,.11*C.focal/q.z);g.fillStyle='#FFFFFF';g.strokeStyle='#1A1A1A';g.lineWidth=1.5;
        g.beginPath();g.arc(q.x,q.y,r,0,Math.PI*2);g.fill();g.stroke();g.fillStyle='#1A1A1A';g.beginPath();g.arc(q.x,q.y,r*.42,0,Math.PI*2);g.fill();
        if(sp.lbl) drawLabel(g,q.x+r+22,q.y-r-6,sp.lbl,'rgba(16,24,20,.85)','#FFFFFF',12);}
    }
  }
  for(const l of labels){const q=P3(l.p,C);if(q)drawLabel(g,q.x,q.y,l.text,l.bg,l.fg,l.px);}
}

function dirHint(tap,best){
  const dx=tap[0]-best[0], dy=tap[1]-best[1], p=[];
  if(dy>45)p.push(T.dirBack); if(dy<-45)p.push(T.front);
  if(dx>45)p.push(T.right); if(dx<-45)p.push(T.left);
  if(!p.length)return '';const t=p.join(T.and);return t[0].toUpperCase()+t.slice(1)+'.';
}

// ---------- Tagesrätsel, Serie, Startseite ----------
const LAUNCH=new Date(2026,9,1);
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function yesterdayStr(){const n=new Date();return todayStr(new Date(n.getFullYear(),n.getMonth(),n.getDate()-1));}
function dayIndex(){const n=new Date();return Math.max(0,Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-LAUNCH)/864e5));}
function seeded(a,seed){a=a.slice();let x=seed;const r=()=>{x=(x*1664525+1013904223)%4294967296;return x/4294967296;};
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const LVL_MIX={beg:[3,2,0],int:[2,2,1],adv:[1,2,2]};
function tierOf(p){return p.rating<=1050?0:p.rating<1250?1:2;}
function prefKey(){return PREFS.discs.slice().sort().join('')+'-p2';} // -p2: Tagesplan-Version, erzwingt neues heutiges Set
// ---------- Fester Tagesplan: ab 6. Oktober 2026 jeden Tag 5 neue Rätsel ohne Wiederholung ----------
const PLAN_START=4; // dayIndex 4 = Tag 5 = 5. Oktober 2026 (heute ebenfalls aus dem Plan)
let PLAN=null;
function buildPlan(){
  const pool=PUZ_DE.filter(p=>(p.disc||'d')==='d'||p.disc==='t');
  const catOf=p=>p.disc==='t'?'c'+p.cat:'d'+p.theme;
  // handgeschriebene Rätsel zuerst, danach die Trainingsaufgaben, jeweils gemischt
  const tiers=[0,1,2].map(t=>[...seeded(pool.filter(p=>tierOf(p)===t&&p.disc!=='t'),97+t),...seeded(pool.filter(p=>tierOf(p)===t&&p.disc==='t'),197+t)]);
  const used=new Set(), days=[];
  for(let d=0;d<300;d++){const out=[],cats=new Set();
    for(const [t,n] of [[0,2],[1,2],[2,1]]) for(let j=0;j<n;j++){
      let pick=tiers[t].find(p=>!used.has(p.id)&&!cats.has(catOf(p)))||tiers[t].find(p=>!used.has(p.id));
      if(!pick) for(const tt of [1,0,2]){pick=tiers[tt].find(p=>!used.has(p.id)&&!cats.has(catOf(p)))||tiers[tt].find(p=>!used.has(p.id));if(pick)break;}
      if(!pick) return days;
      used.add(pick.id);cats.add(catOf(pick));out.push(pick);}
    days.push(out.sort((a,b)=>a.rating-b.rating).map(p=>p.id));}
  return days;}
function planFor(d){if(!PLAN)PLAN=buildPlan();const k=d-PLAN_START;return k>=0&&k<PLAN.length?PLAN[k]:null;}
function renderPlan(){const d0=dayIndex(), rows=[];
  for(let d=d0+1;d<=d0+20;d++){const ids=planFor(d)||dailyIds(d);
    const dt=new Date(LAUNCH.getFullYear(),LAUNCH.getMonth(),LAUNCH.getDate()+d);
    let ds='';try{ds=dt.toLocaleDateString(LANG==='de'?'de-DE':'en-GB',{weekday:'short',day:'numeric',month:'short'});}catch(e){}
    rows.push(`<section class="card"><h3>${T.day} ${d+1} · ${ds}</h3><div class="plist">`+ids.map(id=>{const i=PUZZLES.findIndex(p=>p.id===id),p=PUZZLES[i],r=S.results[id];

function dailyIds(d){const pl=planFor(d);if(pl)return pl;
  const pool=PUZ_DE.filter(p=>PREFS.discs.includes(p.disc||'d'));
  let seed=7;for(const c of PREFS.discs.slice().sort().join(''))seed=(seed*31+c.charCodeAt(0))%100000;
  const tiers=[0,1,2].map(t=>seeded(pool.filter(p=>tierOf(p)===t).map(p=>p.id),seed+11+t));
  const want=LVL_MIX.int, order=[[0,1,2],[1,0,2],[2,1,0]], out=[];
  want.forEach((n,t)=>{for(let j=0;j<n;j++){for(const tt of order[t]){const L=tiers[tt].filter(id=>!out.includes(id));if(L.length){out.push(L[(d*Math.max(n,1)+j)%L.length]);break;}}}});
  const rt=id=>PUZ_DE.find(p=>p.id===id).rating;
  return out.sort((a,b)=>rt(a)-rt(b));}

  GLOSSARY.forEach(g=>g[LANG].forEach(v=>{if(w.startsWith(v.toLowerCase())&&v.length>len){best=g.k;len=v.length;}}));return best;}

// ---------- Aufgaben-Codes und Teilen ----------
const CODE_AB='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', ID2CODE={}, CODE2IDX={};
PUZ_DE.forEach((p,i)=>{let salt=0,code;
  do{let h=2166136261;for(const ch of p.id+'#'+salt){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}
    code='';for(let k=0;k<5;k++){code+=CODE_AB[h%32];h=Math.floor(h/32)^(k*7919);} salt++;}while(CODE2IDX[code]!=null);
  ID2CODE[p.id]=code;CODE2IDX[code]=i;});
function taskLink(code){return (/^https?:$/.test(location.protocol)&&!/claude|anthropic/.test(location.host))?location.origin+location.pathname+'#'+code:'';}
function showShareTask(){const p=P(),code=ID2CODE[p.id],link=taskLink(code);
  openSheet(`<h3>${T.shareTask}</h3><p class="small">${T.shareTaskSub}</p><div class="codebox" aria-label="Code">${code}</div>`+
    (link?`<p class="small linkline">${link}</p>`:`<p class="small">${T.codeHint}</p>`)+
    `<button class="btn ghost" data-share="1" type="button">${T.shareBtn}</button><div id="sharebox2"></div>`);}
function doShareTask(){track('share/task');const p=P(),code=ID2CODE[p.id],link=taskLink(code),txt=T.shareMsg(p.title,code)+(link?'\n'+link:'');
  let top=true;try{top=window.self===window.top;}catch(e){top=false;}
  if(top&&navigator.share){navigator.share({text:txt}).catch(()=>{});return;}
  const fb=()=>{const b=document.getElementById('sharebox2');if(b){b.innerHTML=`<textarea class="sharebox dark" readonly aria-label="${T.shareBtn}">${txt}</textarea>`;const ta=b.firstChild;ta.focus();ta.select();}};
  try{navigator.clipboard.writeText(txt).then(()=>toast(T.copied),fb);}catch(e){fb();}}
function openCode(raw){const c=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');const i=CODE2IDX[c];
  if(i==null){toast(T.codeNotFound);return false;} track('code/open/'+c); closeSheet(); openPuzzle(i,'shared'); return true;}
function checkHash(){let h='';try{h=decodeURIComponent(location.hash.slice(1));}catch(e){}
  if(h.toLowerCase()==='plan'){S.sub='plan';showHome();try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}return;}
  if(h&&CODE2IDX[h.toUpperCase()]!=null){openCode(h);try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}}

const REPORT_REPO='https://github.com/laybunly/badminton-daily-coach/issues/new';
const REP_REASONS=['answer','pos','why','text','other'];
function reportText(){const p=P(), st=ST(), a=S.answers[S.si], code=ID2CODE[p.id];
  const rs=[...S.rep.r].map(k=>T.repR[k]).join(', ')||'–';
  let ans='–'; if(a){ if(a.i!=null&&st.options) ans=`${LET[a.i]} · ${st.options[a.i].t} (${G[a.g].l})`; else ans=G[a.g].l+(S.taps?' '+JSON.stringify(S.taps):''); }
  return [`${T.repTitle}: ${code} · ${p.title}`,`${T.repReason}: ${rs}`,`${T.repComment}: ${S.rep.c||'–'}`,'',
    `Code: ${code} · ID: ${p.id} · ${T.step} ${S.si+1}/${p.steps.length}`,`${T.repAnswer}: ${ans}`,
    `${LANG.toUpperCase()} · ${PREFS.hand==='L'?'L':'R'} · ${PREFS.level} · ${new Date().toISOString().slice(0,10)}`].join('\n');}
function reportHref(){const p=P();return REPORT_REPO+'?title='+encodeURIComponent(`[${ID2CODE[p.id]}] ${p.title}`)+'&body='+encodeURIComponent(reportText());}
function showReport(){track('report/open');if(!S.rep||S.rep.id!==P().id)S.rep={id:P().id,r:new Set(),c:''};const p=P();
  openSheet(`<h3>${T.repTitle}</h3><p class="small">${p.title} · Code ${ID2CODE[p.id]}</p>
  <div class="plabel">${T.repReason}</div><div class="filters" role="group" aria-label="${T.repReason}">`+
  REP_REASONS.map(k=>`<button class="chip ${S.rep.r.has(k)?'on':''}" data-rep="${k}" aria-pressed="${S.rep.r.has(k)}">${T.repR[k]}</button>`).join('')+
  `</div><label class="plabel" for="repc">${T.repComment}</label><textarea id="repc" class="repc" rows="3" placeholder="${T.repPh}">${S.rep.c.replace(/</g,'&lt;')}</textarea>
  ${gcAllowed()?`<button class="btn" data-repsend="1" type="button">${T.repSend}</button><p class="small">${T.repSendNote}</p>`:`<p class="small">${T.repNoSend}</p>`}
  <div class="row"><button class="btn ghost" data-repcopy="1" type="button">${T.repCopy}</button><a class="btn ghost" id="repgh" href="${reportHref()}" target="_blank" rel="noopener">${T.repGh}</a></div><div id="sharebox3"></div>`);
  const ta=document.getElementById('repc'); ta.addEventListener('input',()=>{S.rep.c=ta.value;document.getElementById('repgh').href=reportHref();});}
function sendReport(){const p=P(),code=ID2CODE[p.id],rs=[...S.rep.r].join('+')||'none';
  const c=(S.rep.c||'').replace(/\s+/g,' ').trim().slice(0,200);
  track(`report/${code}/${rs}`,`${p.title} · ${LANG} · ${c||'-'}`);S.rep={id:p.id,r:new Set(),c:''};closeSheet();toast(T.repThanks);}
function copyReport(){track('report/copy');const txt=reportText();let top=true;try{top=window.self===window.top;}catch(e){top=false;}
  const fb=()=>{const b=document.getElementById('sharebox3');if(b){b.innerHTML=`<textarea class="sharebox dark" readonly>${txt.replace(/</g,'&lt;')}</textarea>`;const t=b.firstChild;t.focus();t.select();}};
  try{navigator.clipboard.writeText(txt).then(()=>toast(T.repCopied),fb);}catch(e){fb();}}

// ---------- Anonyme Nutzungsstatistik (GoatCounter, ohne Cookies, nur auf der GitHub-Seite) ----------
const GC_URL='https://badminton-daily-coach.goatcounter.com/count';
const TQ=[]; let gcLoaded=false;
function gcAllowed(){return PREFS.stats!==false&&/^https?:$/.test(location.protocol)&&!/claude|anthropic/.test(location.host);}
function loadGC(){if(gcLoaded||!gcAllowed())return;gcLoaded=true;
  const sc=document.createElement('script');sc.async=true;sc.src='https://gc.zgo.at/count.js';sc.setAttribute('data-goatcounter',GC_URL);
  sc.onload=()=>{while(TQ.length){const e=TQ.shift();track(e[0],e[1]);}};document.head.appendChild(sc);}
function track(path,title){if(!gcAllowed())return;
  const gc=window.goatcounter; if(!gc||!gc.count){if(TQ.length<50)TQ.push([path,title]);return;}
  try{gc.count({path:path,title:title||path,event:true});}catch(e){}}

function renderPanel(){
  const p=P(), st=ST(), n=p.steps.length, a=S.answers[S.si];
  const pos=S.mode==='shared'?`${T.sharedMode} · `:S.mode==='daily'?(getDaily().ids.indexOf(p.id)+1)+'/5 · ':S.mode==='set'&&S.set?`${CATS[S.set.c][LANG]} · ${S.set.ids.indexOf(p.id)+1}/5 · `:'';
  let h=`<div class="ebrow"><div class="eb">${pos}${p.title}${n>1&&S.phase!=='done'?` · ${T.step} ${S.si+1}/${n}`:''}</div><span class="ebacts"><button class="sharelink" data-act="report" type="button" aria-label="${T.repTitle}">⚑ ${T.repShort}</button><button class="sharelink" data-act="sharetask" type="button" aria-label="${T.shareTask}">↗ ${T.shareBtn}</button></span></div>`;
  if(S.phase==='done'){
    const score=S.answers.reduce((s,x)=>s+G[x.g].v,0)/n, g=gradeOf(score);
    h+=`<div class="row" style="gap:12px"><span class="score">${Math.round(score*100)} %</span><span class="badge g-${g}">${G[g].l}</span></div>
    <div class="lesson">${linkify(p.lesson)}</div>
    <p class="small">${S.delta==null?T.noRating:T.saved((S.delta>=0?'+':'')+S.delta,S.rating)}</p>`;
    if(S.mode==='daily'){const dd=getDaily(), left=dd.ids.filter(id=>dd.res[id]==null).length;
      h+=`<div class="row stick">${left?`<button class="btn" data-act="dnext">${T.next}</button>`:`<button class="btn" data-act="home">${T.toSummary}</button>`}</div>`;}
    else h+=`<div class="row stick"><button class="btn" data-act="pnext">${T.practiceNext}</button><button class="btn ghost" data-act="retry">${T.retry}</button></div>`;
    panel.innerHTML=h; return;
  }
  let next;
  if(S.si<n-1) next=`<div class="row stick"><button class="btn" data-act="cont">${T.nextStep}</button></div>`;
  else if(S.mode==='daily'){const dd=getDaily(), left=dd.ids.filter(id=>dd.res[id]==null).length;
    next=`<div class="row stick">${left?`<button class="btn" data-act="dnext">${T.next}</button>`:`<button class="btn" data-act="home">${T.toSummary}</button>`}</div>`;}
  else if(S.mode==='shared') next=`<div class="row stick"><button class="btn" data-act="home">${T.toOverview}</button></div>`;
  else if(S.mode==='set'){const left=S.set.ids.filter(id=>S.sres[id]==null).length;
    next=`<div class="row stick">${left?`<button class="btn" data-act="snext">${T.nextTask}</button>`:`<button class="btn" data-act="setdone">${T.finishSet}</button>`}</div>`;}
  else next=`<div class="row stick" style="flex-wrap:nowrap"><button class="btn" data-act="pnext">${T.practiceNext}</button><button class="btn ghost" data-act="retry" aria-label="${T.retry}" title="${T.retry}">↻</button></div>`;
  if(st.type==='place'){
    if(S.phase==='play'){
      const ks=Object.keys(TG(st)), all=ks.every(k=>S.taps[k]);
      h+=`<p class="q">${linkify(st.q)}</p>`;
      const hint=!S.ready?T.watch:(!all?(ks.length>1?T.dragBoth:(ks[0]==='Y'?T.dragY:T.dragP)):'');
      h+=`${hint?`<p class="hint">${hint}</p>`:''}<div class="row stick"><button class="btn" data-act="lock" ${all?'':'disabled'}>${ks.length>1?T.lockN:T.lock1}</button></div>`;
    } else {
      const TT=TG(st), why=a.g==='good'?st.why.good+' '+st.why.best:st.why.best;
      const per=Object.keys(TT).filter(k=>a.per[k]!=='best'||Object.keys(TT).length===1&&false).map(k=>`<div class="per"><span class="g g-${a.per[k]}">${G[a.per[k]].l}</span><b>${NAME[k]}</b><span>${dirHint(S.taps[k],TT[k].best)||T.exact}</span></div>`).join('');
      h+=`<div class="verdict"><span class="badge g-${a.g}">${G[a.g].l}</span>${per}<p>${linkify(why)}</p></div>`+next;
    }
  } else if(!a){
    h+=`<p class="q">${linkify(st.q)}</p><div class="opts">`+st.options.map((o,i)=>
      `<button class="opt" data-opt="${i}" ${!S.ready?'disabled':''}><span class="k">${LET[i]}</span><span class="lbl">${o.t}</span></button>`).join('')+`</div>`;
  } else {
    const vi=S.view!=null?S.view:a.i, o=st.options[vi];
    h+=`<div class="ochips"><span class="small">${T.otherOpts}</span>`+st.options.map((x,i)=>
      `<button class="ochip ${i===vi?'on':''}" data-opt="${i}" style="background:${MAT[x.g]}" aria-label="${LET[i]} · ${x.t} · ${G[x.g].l}" aria-pressed="${i===vi}">${LET[i]}</button>`).join('')+`</div>
    <div class="verdict"><div class="row" style="gap:8px"><span class="badge g-${o.g}">${LET[vi]} · ${G[o.g].l}</span><b>${o.t}</b></div><p>${linkify(o.why)}</p>`+
    (vi===a.i&&o.g!=='best'?(()=>{const bi=st.options.findIndex(x=>x.g==='best'),bo=st.options[bi];
      return `<div class="bestbox"><div class="row" style="gap:8px"><span class="badge g-best">${LET[bi]} · ${G.best.l}</span><b>${bo.t}</b></div><p>${linkify(bo.why)}</p></div>`;})():'')+`</div>`+next;
  }
  panel.innerHTML=h;
}
function render(){renderHeader();renderSVG();renderPanel();}

function startPuzzle(i){applyPending();cancelAnimationFrame(corrRaf);S.corr=1;S.pi=i;S.si=0;S.answers=[];S.taps={};S.active=Object.keys(TG(PUZZLES[i].steps[0]))[0];S.view=null;S.phase='play';S.delta=null;S.t=0;S.ready=false;render();panel.scrollTop=0;play();}
function nextStep(){cancelAnimationFrame(corrRaf);S.corr=1;S.si++;S.taps={};S.active=Object.keys(TG(PUZZLES[S.pi].steps[S.si]))[0];S.view=null;S.phase='play';S.t=0;S.ready=false;render();panel.scrollTop=0;play();}
function finish(){
  const p=P(), score=S.answers.reduce((s,x)=>s+G[x.g].v,0)/p.steps.length;
  const first=S.results[p.id]==null;
  if(S.mode==='daily'||first){const E=1/(1+Math.pow(10,(p.rating-S.rating)/400)); S.delta=Math.round(32*(score-E)); S.rating+=S.delta;} else S.delta=null;
  S.results[p.id]=Math.max(S.results[p.id]??0,score);
  track(`task/${ID2CODE[p.id]}/${gradeOf(score)}`,`${p.id} · ${S.mode}`);
  if(S.mode==='set'&&S.sres) S.sres[p.id]=score;
  if(S.mode==='daily'){const dd=getDaily(); if(dd.res[p.id]==null){dd.res[p.id]=score; store.set('daily',dd);} if(dd.ids.every(id=>dd.res[id]!=null)){bumpStreak();track('daily/finish','Daily set finished');}}
  store.set('rating',S.rating);store.set('results',S.results);
  renderHeader();
}

function placeAt(qx,qy){
  const st=ST(); if(st.type!=='place'||S.phase!=='play'||!S.ready) return;
  if(qx<-30||qx>640||qy<640||qy>1380) return;
  S.taps[S.active]=[Math.round(Math.max(20,Math.min(590,qx))),Math.round(Math.max(700,Math.min(1320,qy)))];
  const nxt=Object.keys(TG(st)).find(k=>!S.taps[k]); if(nxt) S.active=nxt;
  renderSVG(); renderPanel();
}
// Spieler ziehen oder aufs Feld tippen
let drag=null;
function svgPt(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
function canPlace(){const st=ST();return st.type==='place'&&S.phase==='play'&&S.ready;}
svg.addEventListener('pointerdown',e=>{
  if(!canPlace())return; const q=svgPt(e), st=ST(); let hit=null, bd=80;
  for(const k of Object.keys(TG(st))){const p=S.taps[k]||st.players[k], d=Math.hypot(p[0]-q.x,p[1]-q.y); if(d<bd){bd=d;hit=k;}}
  drag={k:hit,x0:e.clientX,y0:e.clientY,moved:false,off:e.pointerType==='mouse'?0:75};
  if(hit){try{svg.setPointerCapture(e.pointerId);}catch(_){}}
  e.preventDefault();
});
svg.addEventListener('pointermove',e=>{
  if(!drag||!drag.k)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6)return;
  drag.moved=true; S.active=drag.k; const q=svgPt(e);
  S.taps[drag.k]=[Math.round(Math.max(20,Math.min(590,q.x))),Math.round(Math.max(700,Math.min(1320,q.y-drag.off)))];
  renderSVG();
});
svg.addEventListener('pointerup',e=>{
  if(!drag)return; const d=drag; drag=null;
  if(d.k&&d.moved){const nxt=Object.keys(TG(ST())).find(k=>!S.taps[k]); if(nxt)S.active=nxt; renderSVG(); renderPanel(); return;}
  if(d.k&&Object.keys(TG(ST())).length>1){S.active=d.k; renderSVG(); renderPanel(); return;}
  if(Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<12){const q=svgPt(e); placeAt(q.x,q.y);}
});
svg.addEventListener('pointercancel',()=>{drag=null;});
document.getElementById('replay').addEventListener('click',()=>{if(S.paused)play();else pause();});
panel.addEventListener('keydown',e=>{const t=e.target.closest&&e.target.closest('.term');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();showTerm(t.dataset.term);}});
panel.addEventListener('click',e=>{
  const tm=e.target.closest('.term'); if(tm){showTerm(tm.dataset.term);return;}
  const b=e.target.closest('button'); if(!b) return;
  const st=ST();
  if(b.dataset.opt!=null){
    const i=+b.dataset.opt;
    if(!S.answers[S.si]){S.answers[S.si]={i,g:st.options[i].g};S.phase='answered';S.view=null;if(S.si===P().steps.length-1)finish();}
    else S.view=i;
    renderSVG(); renderPanel(); panel.scrollTop=0; return;
  }
  if(b.dataset.who){S.active=b.dataset.who;renderSVG();renderPanel();return;}
  const act=b.dataset.act;
  if(act==='lock'){
    const T=TG(st), per={}; let sum=0;
    for(const [k,t] of Object.entries(T)){const tp=S.taps[k]; if(!tp) return;
      const d=Math.hypot(tp[0]-t.best[0],tp[1]-t.best[1]);
      per[k]=d<=t.rBest?'best':d<=t.rGood?'good':d<=t.rGood*1.8?'inacc':'mistake'; sum+=G[per[k]].v;}
    S.answers[S.si]={g:gradeOf(sum/Object.keys(T).length),per}; S.phase='answered'; if(S.si===P().steps.length-1)finish(); renderSVG(); renderPanel(); panel.scrollTop=0; startCorr();
  }
  if(act==='cont'&&S.si<P().steps.length-1) nextStep();
  if(act==='sharetask'){showShareTask();return;}
  if(act==='report'){showReport();return;}
  if(act==='dnext') openDaily();
  if(act==='snext') nextInSet();
  if(act==='setdone') setDone();
  if(act==='pnext'){const k=PRACT.indexOf(S.pi); startPuzzle(PRACT[(k+1)%PRACT.length]);}
  if(act==='retry') startPuzzle(S.pi);
  if(act==='home') showHome();
});

document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet'||e.target.id==='sheet-close'){closeSheet();return;}const b=e.target.closest('button');if(!b)return;if(b.dataset.gl)showGlossary();else if(b.dataset.share)doShareTask();else if(b.dataset.rep){const k=b.dataset.rep;S.rep.r.has(k)?S.rep.r.delete(k):S.rep.r.add(k);b.classList.toggle('on');b.setAttribute('aria-pressed',S.rep.r.has(k));document.getElementById('repgh').href=reportHref();}else if(b.dataset.repcopy)copyReport();else if(b.dataset.repsend)sendReport();else if(b.dataset.planOpen){closeSheet();S.sub='plan';if(S.screen==='play')showHome();else{renderHeader();renderHome();homeEl.scrollTop=0;}}else if(b.dataset.stats!=null){PREFS.stats=b.dataset.stats==='1';store.set('prefs3',{level:curPrefs().level,hand:curPrefs().hand,stats:PREFS.stats});if(PREFS.stats){loadGC();track('settings/stats-on');}showSettings();}else if(b.dataset.lang)setPref('lang',b.dataset.lang);else if(b.dataset.hand)setPref('hand',b.dataset.hand);else if(b.dataset.lvl)setPref('level',b.dataset.lvl);});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#repgh')){track('report/github');setTimeout(()=>{closeSheet();toast(T.repThanks);},300);}});
document.getElementById('home').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='dstart')openDaily();
  else if(b.dataset.act==='glossary'){showGlossary();}
  else if(b.dataset.act==='opencode'){const v=document.getElementById('codein');if(v)openCode(v.value);}
  else if(b.dataset.act==='settings'){showSettings();}
  else if(b.dataset.plan!=null){openPuzzle(+b.dataset.plan,'shared');}
  else if(b.dataset.cat!=null){S.sub='cat';S.cat=+b.dataset.cat;renderHome();homeEl.scrollTop=0;}
  else if(b.dataset.set!=null){openSet(S.cat,+b.dataset.set);}
  else if(b.dataset.act==='pool'){S.sub='pool';renderHome();homeEl.scrollTop=0;}
  else if(b.dataset.act==='totrain'){S.sub='train';renderHeader();renderHome();homeEl.scrollTop=0;}
  else if(b.dataset.act==='practice'){S.sub='train';renderHeader();renderHome();homeEl.scrollTop=0;}
  else if(b.dataset.act==='tohome'){S.sub=null;renderHeader();renderHome();homeEl.scrollTop=0;}
  else if(b.dataset.act==='share')shareDaily();
  else if(b.dataset.pf){S.pf=b.dataset.pf;renderHome();}
  else if(b.dataset.act==='editprefs'){S.tmp=JSON.parse(JSON.stringify(PREFS));S.editPrefs=true;renderHome();homeEl.scrollTop=0;}
  else if(b.dataset.act==='cancelprefs'){S.editPrefs=false;renderHome();}
  else if(b.dataset.disc){const k=b.dataset.disc,a=S.tmp.discs;S.tmp.discs=a.includes(k)?a.filter(x=>x!==k):a.concat(k);renderHome();}
  else if(b.dataset.lvl){S.tmp.level=b.dataset.lvl;renderHome();}
  else if(b.dataset.act==='saveprefs'&&S.tmp.discs.length){PREFS={discs:S.tmp.discs,level:S.tmp.level,set:true};store.set('prefs',PREFS);
    PUZZLES=buildPuzzles();S.editPrefs=false;S.tmp=null;renderHeader();renderHome();homeEl.scrollTop=0;}
  else if(b.dataset.pid!=null)openPuzzle(+b.dataset.pid,'practice');});
homeEl.addEventListener('keydown',e=>{if(e.target.id==='codein'&&e.key==='Enter'){e.preventDefault();openCode(e.target.value);}});
setInterval(()=>{if(S.screen!=='home')return;const dd=store.get('daily',null);if(!dd||dd.date!==todayStr()){renderHeader();renderHome();return;}
  const e=document.getElementById('cd');if(e&&e.dataset.live)e.textContent=T.newIn(untilMidnight());},30000);

document.getElementById('lang').addEventListener('click',()=>{applyLang(LANG==='de'?'en':'de',true);if(S.screen==='home'){renderHeader();renderHome();}else render();});
// Eigenes Ausschalten der Statistik per Link (#toggle-goatcounter oder #nostats), mit sichtbarer Bestätigung
function statsHash(){let h='';try{h=decodeURIComponent(location.hash.slice(1)).toLowerCase();}catch(e){}
  if(h!=='toggle-goatcounter'&&h!=='nostats'&&h!=='stats')return null;
  PREFS.stats=h==='stats'?true:(h==='nostats'?false:!PREFS.stats);
  store.set('prefs3',{level:PREFS.level,hand:PREFS.hand,stats:PREFS.stats});
  try{if(!PREFS.stats)localStorage.setItem('skipgc','t');else localStorage.removeItem('skipgc');}catch(e){}
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  return PREFS.stats?T.statsOnMsg:T.statsOffMsg;}
const statsMsg=statsHash();
window.addEventListener('hashchange',()=>{const m=statsHash();if(m){if(PREFS.stats)loadGC();toast(m);}});
loadGC();
showHome();
checkHash();
if(statsMsg)setTimeout(()=>toast(statsMsg),300);
</script>
</body>
</html>
